name: qcaus_secure
description: QCAUS Secure Communications Suite
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cryptography: ^2.7.0
  crypto: ^3.0.6
  file_picker: ^8.0.7
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icons/qcaus_secure_icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/qcaus_secure_icon.png"
  min_sdk_android: 24
  remove_alpha_ios: true
